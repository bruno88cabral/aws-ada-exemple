AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Padaria na AWS - infraestrutura (SAM)

Parameters:
  BucketName:
    Type: String
    Default: padaria-fotos-bruno
    Description: Nome do bucket das fotos (precisa ser unico na AWS; troque se ja estiver em uso)
  AllowedOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Origem do Next liberada no CORS do bucket
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: "DATABASE_URL da processar-pedido. Para RDS termine a URL com ?uselibpqcompat=true&sslmode=require"
  ChaosFailRate:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: "Probabilidade (0 a 1) da processar-pedido falhar de proposito, para o roteiro de caos (docs/caos.md). Producao: 0"
  SesFrom:
    Type: String
    Description: Remetente do e-mail (identidade verificada no SES; em sandbox, igual ao destinatario)

Resources:
  FotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
              - GET
            AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedHeaders:
              - "*"
            MaxAge: 3000

  PedidosDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pedidos-dlq

  PedidosQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: pedidos
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PedidosDlq.Arn
        maxReceiveCount: 3

  ProcessarPedidoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: processar-pedido
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: dist/processar-pedido/
      Timeout: 25
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          SNS_TOPIC_ARN: !Ref PedidoConfirmadoTopic
          CHAOS_FAIL_RATE: !Ref ChaosFailRate
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt PedidosQueue.QueueName
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt PedidoConfirmadoTopic.TopicName
      Events:
        Pedidos:
          Type: SQS
          Properties:
            Queue: !GetAtt PedidosQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  PedidoConfirmadoTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: pedido-confirmado

  EnviarEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: enviar-email
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: dist/enviar-email/
      Timeout: 25
      Environment:
        Variables:
          SES_FROM: !Ref SesFrom
      Policies:
        # SESv2 SendEmail usa a acao ses:SendEmail. Resource "*" porque o ARN da
        # identidade depende da conta do aluno e do formato (e-mail ou dominio).
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
      Events:
        PedidoConfirmado:
          Type: SNS
          Properties:
            Topic: !Ref PedidoConfirmadoTopic

Outputs:
  BucketName:
    Description: Valor de S3_BUCKET no .env.local
    Value: !Ref FotosBucket
  PedidosQueueUrl:
    Description: Valor de SQS_QUEUE_URL no .env.local
    Value: !Ref PedidosQueue
  PedidoConfirmadoTopicArn:
    Description: Valor de SNS_TOPIC_ARN (a processar-pedido ja recebe do template)
    Value: !Ref PedidoConfirmadoTopic
